cargo-features = ["codegen-backend"]

[workspace]
members = ["tilers", "tilers_core", "tilers_dioxus", "tilers_grafana", "tilers_leptos"]
default-members = ["tilers_dioxus"]
resolver = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"
too_many_arguments = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.dependencies]
clap = { version = "^4.5.4", features = ["derive"] }
console_error_panic_hook = "0.1"
dioxus = { version = "^0.7", default-features = false, features = ["lib"] } # no `devtools`/`launch`: consumers choose those
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "^0.8" }
send_wrapper = "0.6"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tilers_core = { path = "tilers_core", version = "0.3.3" }
tilers_dioxus = { path = "tilers_dioxus", version = "0.3.3" }
tilers_leptos = { path = "tilers_leptos", version = "0.3.3" }
v_utils = { version = "^2.17.7", features = ["io", "macros", "cli"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
