env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  e2e:
    name: e2e
    outputs:
      prepare_seconds: ${{ steps.run.outputs['e2e_prepare_seconds'] }}
      seconds: ${{ steps.run.outputs['e2e_seconds'] }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\necho $OUT_PATHS >> /tmp/nix-lean-cache/built\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org file:///tmp/nix-lean-cache
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - id: lean-restore
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean3-particle-e2e-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
          restore-keys: |-
            nix-lean3-particle-e2e-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-lean3-particle-e2e-${{ runner.os }}-
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: particle-cache-0
        name: Restore particle's cache
        uses: actions/cache/restore@v5
        with:
          key: particles-errors-e2e-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particles-errors-e2e-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - id: run
        run: nix run .#test -- --severity errors e2e
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Save particle's cache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
          path: ~/.npm
      - env:
          FAMILY: particles-errors-e2e-0-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Drop particle's older caches
        run: gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Fetch the flake's inputs into the tarball cache
        run: nix flake archive --store "$RUNNER_TEMP/inputs" --option substitute false > /dev/null && chmod -R u+w "$RUNNER_TEMP/inputs" && rm -rf "$RUNNER_TEMP/inputs"
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Save nix eval cache
        uses: actions/cache/save@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - env:
          FAMILY: nix-eval2-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.eval-cache.outputs.cache-primary-key }}
        if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Drop older nix eval caches
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | while read -r id; do
            gh cache delete -R "$GITHUB_REPOSITORY" "$id" || ! gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id -q '.[].id' | grep -qx "$id"
          done
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Prune lean nix cache to what this run used
        run: |
          cd /tmp/nix-lean-cache
          shopt -s nullglob
          narinfos=(*.narinfo)
          ((${#narinfos[@]})) || exit 0
          [ -e built ] || : > built
          sed -n 's/^StorePath: //p' "${narinfos[@]}" | sort -u > /tmp/lean-all
          tr -s ' ' '\n' < built | sed '/^$/d' | sort -u | comm -12 - /tmp/lean-all > /tmp/lean-built
          xargs -r nix-store --check-validity --print-invalid < /tmp/lean-built | sort -u | comm -23 /tmp/lean-built - > /tmp/lean-keep
          comm -23 /tmp/lean-all /tmp/lean-keep | while read -r p; do
            n=$(basename "$p") && n=${n%%-*}.narinfo
            echo "$n" && sed -n 's/^URL: //p' "$n"
          done | sudo xargs -r rm -f
          sudo rm -f built && cp /tmp/lean-keep built
        shell: bash
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Save lean nix cache
        uses: actions/cache/save@v5
        with:
          key: nix-lean3-particle-e2e-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
      - env:
          FAMILY: nix-lean3-particle-e2e-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.lean-restore.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Drop older lean nix caches
        run: gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
    timeout-minutes: 90
  e2e-grafana:
    name: e2e-grafana
    outputs:
      prepare_seconds: ${{ steps.run.outputs['e2e-grafana_prepare_seconds'] }}
      seconds: ${{ steps.run.outputs['e2e-grafana_seconds'] }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\necho $OUT_PATHS >> /tmp/nix-lean-cache/built\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org file:///tmp/nix-lean-cache
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - id: lean-restore
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean3-particle-e2e-grafana-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
          restore-keys: |-
            nix-lean3-particle-e2e-grafana-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-lean3-particle-e2e-grafana-${{ runner.os }}-
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: particle-cache-0
        name: Restore particle's cache
        uses: actions/cache/restore@v5
        with:
          key: particles-errors-e2e-grafana-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
          restore-keys: particles-errors-e2e-grafana-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - id: run
        run: nix run .#test -- --severity errors e2e-grafana
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Save particle's cache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
          path: ~/.npm
      - env:
          FAMILY: particles-errors-e2e-grafana-0-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Drop particle's older caches
        run: gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Fetch the flake's inputs into the tarball cache
        run: nix flake archive --store "$RUNNER_TEMP/inputs" --option substitute false > /dev/null && chmod -R u+w "$RUNNER_TEMP/inputs" && rm -rf "$RUNNER_TEMP/inputs"
      - if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Save nix eval cache
        uses: actions/cache/save@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - env:
          FAMILY: nix-eval2-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.eval-cache.outputs.cache-primary-key }}
        if: always() && steps.eval-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        name: Drop older nix eval caches
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | while read -r id; do
            gh cache delete -R "$GITHUB_REPOSITORY" "$id" || ! gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id -q '.[].id' | grep -qx "$id"
          done
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Prune lean nix cache to what this run used
        run: |
          cd /tmp/nix-lean-cache
          shopt -s nullglob
          narinfos=(*.narinfo)
          ((${#narinfos[@]})) || exit 0
          [ -e built ] || : > built
          sed -n 's/^StorePath: //p' "${narinfos[@]}" | sort -u > /tmp/lean-all
          tr -s ' ' '\n' < built | sed '/^$/d' | sort -u | comm -12 - /tmp/lean-all > /tmp/lean-built
          xargs -r nix-store --check-validity --print-invalid < /tmp/lean-built | sort -u | comm -23 /tmp/lean-built - > /tmp/lean-keep
          comm -23 /tmp/lean-all /tmp/lean-keep | while read -r p; do
            n=$(basename "$p") && n=${n%%-*}.narinfo
            echo "$n" && sed -n 's/^URL: //p' "$n"
          done | sudo xargs -r rm -f
          sudo rm -f built && cp /tmp/lean-keep built
        shell: bash
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Save lean nix cache
        uses: actions/cache/save@v5
        with:
          key: nix-lean3-particle-e2e-grafana-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
      - env:
          FAMILY: nix-lean3-particle-e2e-grafana-${{ runner.os }}-
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.lean-restore.outputs.cache-primary-key }}
        if: always() && github.ref_name == github.event.repository.default_branch && steps.lean-restore.outputs.cache-hit != 'true'
        name: Drop older lean nix caches
        run: gh cache list -R "$GITHUB_REPOSITORY" -L 100 --key "$FAMILY" --json id,key -q 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
    timeout-minutes: 90
  pre_ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  report:
    if: always() && github.ref_name == github.event.repository.default_branch
    name: Report
    needs:
      - e2e
      - e2e-grafana
      - rust-tests
      - tilers_grafana-plugin-typecheck
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PARTICLES: '["rust-tests","tilers_grafana-plugin-typecheck","e2e","e2e-grafana"]'
          TIMED: '[{"key":"build","output":"prepare_seconds","particle":"rust-tests"},{"key":"test","output":"seconds","particle":"rust-tests"}]'
        name: Tally the particles
        run: |
          read -r failed total seconds incomplete < <(jq -rn --argjson needs "$NEEDS" --argjson spec "$PARTICLES" '
            def secs: if . == null or . == "" then 0 else tonumber end;
            [ $spec[] | $needs[.] as $j | { ok: ($j.result == "success"), t: ($j.outputs.seconds | secs), r: $j.result } ]
            | "\(map(select(.ok | not)) | length) \(length) \(map(.t) | add) \(map(select(.r == "skipped" or .r == "cancelled")) | length)"')
          if [ "$incomplete" != 0 ]; then
            echo "::notice::a particle's job was skipped or cancelled: the badge keeps its last complete run"
            exit 0
          fi
          # only a succeeded job's numbers: a failed run's are partial
          jq -rn --argjson needs "$NEEDS" --argjson timed "$TIMED" '
            $timed[] | select($needs[.particle].result == "success")
            | ($needs[.particle].outputs[.output] | tonumber) as $s
            | "BADGE_\(.key | ascii_upcase)=\($s / 60 | floor)m \($s % 60)s"' >> "$GITHUB_ENV"
          time="$((seconds / 60))m $((seconds % 60))s"
          if [ "$failed" = 0 ]; then msg="✓ $time" color=brightgreen; else msg="✗ $((total - failed))/$total · $time" color=red; fi
          { echo "BADGE_MESSAGE=$msg"; echo "BADGE_COLOR=$color"; } >> "$GITHUB_ENV"
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: env.BADGE_MESSAGE != ''
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-errors.json][content]={\"schemaVersion\": 1, \"label\": \"errors\", \"message\": \"$BADGE_MESSAGE\", \"color\": \"$BADGE_COLOR\", \"labelColor\": \"420d09\"}"
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: env.BADGE_BUILD != '' && env.BADGE_TEST != ''
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: env.BADGE_BUILD != '' && env.BADGE_TEST != ''
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-build.json][content]={\"schemaVersion\": 1, \"label\": \"build\", \"message\": \"$BADGE_BUILD\", \"color\": \"lightblue\"}" \
          -f "files[$PNAME-test.json][content]={\"schemaVersion\": 1, \"label\": \"test\", \"message\": \"$BADGE_TEST\", \"color\": \"lightblue\"}"
  rust-tests:
    name: rust-tests
    outputs:
      prepare_seconds: ${{ steps.run.outputs['rust-tests_prepare_seconds'] }}
      seconds: ${{ steps.run.outputs['rust-tests_seconds'] }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\necho $OUT_PATHS >> /tmp/nix-lean-cache/built\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            extra-substituters = https://valeratrades.cachix.org file:///tmp/nix-lean-cache
            extra-trusted-public-keys = valeratrades.cachix.org-1:gXVwhzO5YB+BaiEJYT48qZgzdaErGQew6xtZcz4Fo1Q=
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - id: lean-restore
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean3-particle-rust-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/*.nix') }}
          path: /tmp/nix-lean-cache
          restore-keys: |-
            nix-lean3-particle-rust-tests-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-lean3-particle-rust-tests-${{ runner.os }}-
      - id: eval-cache
        name: Restore nix eval cache
        uses: actions/cache/restore@v5
        with:
          key: nix-eval2-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          path: ~/.cache/nix
      - id: particle-cache-0
        name: Restore particle's cache
        uses: actions/cache/restore@v5
        with:
          key: particles-errors-rust-tests-0-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('./Cargo.lock', './**/Cargo.toml', './**/*.rs') }}
          path: |-
            ./target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          restore-keys: particles-errors-rust-tests-0-${{ runner.os }}-
      - if: steps.particle-cache-0.outputs.cache-matched-key != ''
        name: Align the checkout with particle's cache
        run: |
          [ -f ./target/.commit ] || exit 0
          built=$(cat ./target/.commit)
          git fetch -q --depth=1 origin "$built" || { echo "::notice::$built, the cached build's commit, can't be fetched: every watched file reads as changed"; exit 0; }
          find . -path ./.git -prune -o -path ./target -prune -o -exec touch -h -d @1 {} +
          git diff --no-renames --name-only "$built" HEAD | while read -r p; do
            while [ "$p" != . ]; do
              [ ! -e "$p" ] || touch -h "$p"
              p=$(dirname "$p")
            done
          done
        shell: bash
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Stamp particle's cache
        run: '[ ! -d ./target ] || find ./target -type f -exec touch -a -d @1 {} +'
        shell: bash
      - id: run
        run: nix run .#test -- --severity errors rust-tests
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Sweep particle's cache
        run: |
          [ -d ./target ] || exit 0
          probe=$(mktemp -p ./target) && echo x > "$probe" && touch -a -d @1 "$probe" && cat "$probe" > /dev/null
          [ "$(stat -c %X "$probe")" != 1 ] || { echo "::error::a read doesn't update atime here: the sweep can't tell the units this run used"; exit 1; }
          rm "$probe"
          used=0 dropped=0
          for fp in ./target/*/.fingerprint/*/ ./target/*/*/.fingerprint/*/; do
            [ -d "$fp" ] || continue
            if [ -n "$(find "$fp" -type f -newerat @2 -print -quit)" ]; then used=$((used + 1)); continue; fi
            unit=${fp%/}; hash=${unit##*-}; dir=${unit%/.fingerprint/*}
            rm -rf "$fp" "$dir"/build/*-"$hash" "$dir"/deps/*-"$hash" "$dir"/deps/*-"$hash".* "$dir"/examples/*-"$hash" "$dir"/examples/*-"$hash".*
            dropped=$((dropped + 1))
          done
          echo "cargo units kept: $used, dropped: $dropped"
          git rev-parse HEAD > ./target/.commit
        shell: bash
      - if: always() && github.ref_name == github.event.repository.default_branch && steps.particle-cache-0.outputs.cache-hit != 'true'
        name: Save particle's cache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.particle-cache-0.outputs.cache-primary-key }}
