[package]
name = "tilers_leptos"
version = "0.3.4"
edition = "2024"
description = "Leptos binding for the tilers packed-grid tiling layout. Drives the framework-agnostic tilers_core engine."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/tilers"
readme = "../README.md"
keywords = ["leptos", "layout", "docking", "tiling", "wasm"]
categories = ["gui", "wasm"]

[lib]

# Trunk serves this CSR app as a `[[bin]]` (it can't target an `[[example]]`). It stays out of a
# bare `cargo b` (that only builds `default-members`), so the workspace default build is unaffected.
[[bin]]
name = "insilico_leptos"
path = "../examples/insilico_leptos/main.rs"

[features]
# `csr` must NOT be default: a facade consumer (e.g. `site`) enabling `leptos/ssr` or `leptos/hydrate`
# would otherwise be forced into `leptos/csr` too (mutually exclusive → build break). The standalone
# trunk bin opts in via `data-cargo-features="csr"` in index.html.
default = []
csr = ["leptos/csr"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = "0.6"

[dependencies]
leptos.workspace = true
tilers_core.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage", "Document", "Element", "HtmlElement", "HtmlDivElement", "DomRect", "Node", "NodeList", "EventTarget", "KeyboardEvent", "MouseEvent", "PointerEvent", "ResizeObserver", "console"] }

[lints]
workspace = true
